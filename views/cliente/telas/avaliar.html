<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avaliar serviço - NitroCar</title>
  <link rel="stylesheet" href="../../../css/estilo.css">
</head>
<body>
  <script src="../../../js/protecao.js" data-perfil="cliente"></script>
  <main>
    <h1>Avaliar serviço</h1>
    <p class="subtitulo">Sua opinião ajuda a melhorar o atendimento.</p>
    
    <select>
      <option>5 estrelas - Ótimo</option>
      <option>4 estrelas - Bom</option>
      <option>3 estrelas - Regular</option>
      <option>2 estrelas - Ruim</option>
      <option>1 estrela - Péssimo</option>
    </select>
    <input type="text" placeholder="Deixe um comentário (opcional)">
    <button onclick="alert('Obrigado pela sua avaliação!')">Enviar avaliação</button>
  </main>
</body>
</html>
